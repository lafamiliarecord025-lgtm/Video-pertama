name: Render Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render video
        run: python3 script.py

      - name: Upload hasil video
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video
          path: hasil-video.mp4
